<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Agent Profiles">
  <!-- The 16px and 32px variant. The stacked card behind the tile carries no
       information at this size — it survives as three grey pixels that read as
       a rendering artefact — so it is dropped and the letters take the space. -->
  <rect x="32" y="32" width="960" height="960" rx="200" fill="#dd6b32"/>
  <text x="512" y="700" font-family="Georgia, 'Times New Roman', serif" font-size="580" font-weight="700" fill="#fffaf2" text-anchor="middle">ap</text>
</svg>
